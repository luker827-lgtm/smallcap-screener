name: Run Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener_v2.py
        env:
          PYTHONUNBUFFERED: "1"  # <--- THIS IS CRITICAL

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add report_*.csv track_record.csv || true
          git commit -m "Automated results: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
